{% extends "base.html" %}{% block auth %}
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brandmark mx-auto mb-2" style="width:52px;height:52px;font-size:24px">R</div>
      <h4 class="fw-bold mb-0">Set your password</h4>
      <small class="text-muted">Hi {{user_name}}, choose a new password to replace the temporary one</small>
    </div>
    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
      <div class="alert alert-{{ 'danger' if cat=='danger' else 'success' }} py-2">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{csrf_token}}">
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control" name="password" minlength="8" required autofocus>
        <small class="text-muted">At least 8 characters.</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm new password</label>
        <input type="password" class="form-control" name="confirm_password" minlength="8" required>
      </div>
      <button class="btn btn-primary w-100 py-2">Set password &amp; continue</button>
    </form>
  </div>
</div>
{% endblock %}
