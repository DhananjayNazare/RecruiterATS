{% extends "base.html" %}{% block content %}
<div class="page-wrap">
  <div class="card">
    <div class="card-header py-3 px-4 d-flex justify-content-between align-items-center">
      <span><i class="bi bi-building me-2 text-primary"></i>Edit Company</span>
      <a class="btn btn-sm btn-outline-secondary" href="{{url_for('operations')}}"><i class="bi bi-arrow-left me-1"></i>Back</a>
    </div>
    <div class="card-body p-4">
      <form method="post" action="{{url_for('operations_edit_company',item_id=company.id)}}">
        <input type="hidden" name="_csrf_token" value="{{csrf_token}}">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Company Name</label>
            <input class="form-control" name="name" value="{{company.name or ''}}" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Industry</label>
            <input class="form-control" name="industry" value="{{company.industry or ''}}">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Website</label>
            <input class="form-control" name="website" value="{{company.website or ''}}">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Company Email</label>
            <input class="form-control" type="email" name="email" value="{{company.email or ''}}">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Contact Person</label>
            <input class="form-control" name="contact_person" value="{{company.contact_person or ''}}">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Contact Person Email</label>
            <input class="form-control" type="email" name="contact_email" value="{{company.contact_email or ''}}">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Contact Number</label>
            <input class="form-control" name="contact_number" value="{{company.contact_number or ''}}">
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">Categories</label>
            <input class="form-control" name="categories" value="{{company.categories or ''}}" placeholder="IT, Electrical, HR">
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">Locations</label>
            <input class="form-control" name="locations" value="{{company.locations or ''}}" placeholder="Pune, Mumbai">
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">Skills</label>
            <input class="form-control" name="skills" value="{{company.skills or ''}}" placeholder="Python, SQL, Java">
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a class="btn btn-outline-secondary" href="{{url_for('operations')}}">Cancel</a>
          <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
