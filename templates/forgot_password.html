{% extends "base.html" %}{% block auth %}
<div class="login-wrap rt-reset">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="rt-reset-icon"><i class="bi bi-envelope-paper-fill"></i></div>
      <h4 class="fw-bold mb-0">Reset your password</h4>
      <small class="text-muted">We'll email you a temporary password</small>
    </div>
    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
      <div class="alert alert-{{ 'danger' if cat=='danger' else 'success' }} py-2">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{csrf_token}}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{email or ''}}" required autofocus>
      </div>
      <button class="btn btn-primary w-100 py-2">Send temporary password</button>
    </form>
    <div class="text-center mt-3">
      <small class="text-muted"><a href="{{url_for('login')}}">Back to sign in</a></small>
    </div>
  </div>
</div>
{% endblock %}
