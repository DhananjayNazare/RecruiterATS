{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:850px">
  <div class="card-header py-3 px-4">{{'Edit Candidate' if candidate else 'Add Candidate'}}</div>
  <div class="card-body p-4">
    <form class="row g-3" method="post" enctype="multipart/form-data">
      <div class="col-12 d-flex align-items-center gap-3">
        <img id="photoPreview" class="candidate-photo candidate-photo-lg"
             src="{% if candidate and candidate.photo %}{{url_for('uploads',name=candidate.photo)}}{% else %}{{url_for('static',filename='img/avatar-placeholder.svg')}}{% endif %}"
             alt="Candidate photo" onerror="this.src='{{url_for('static',filename='img/avatar-placeholder.svg')}}'">
        <div>
          <label class="form-label mb-1">Candidate photo</label>
          <input type="file" class="form-control form-control-sm" name="photo" accept=".png,.jpg,.jpeg,.webp,.gif"
                 onchange="if(this.files&&this.files[0]){document.getElementById('photoPreview').src=URL.createObjectURL(this.files[0]); const rp=document.getElementById('removePhotoWrap'); if(rp) rp.querySelector('input').checked=false;}">
          {% if candidate and candidate.photo %}
          <div class="form-check mt-1" id="removePhotoWrap">
            <input class="form-check-input" type="checkbox" name="remove_photo" value="1" id="removePhoto">
            <label class="form-check-label small text-muted" for="removePhoto">Remove current photo</label>
          </div>
          {% endif %}
        </div>
      </div>
      <div class="col-12 col-md-6"><input class="form-control" name="name" placeholder="Full name" value="{{candidate.name if candidate else ''}}" required></div>
      <div class="col-12 col-md-6"><input type="email" class="form-control" name="email" placeholder="Email" value="{{candidate.email if candidate else ''}}"></div>
      <div class="col-12 col-md-6"><input class="form-control" name="phone" placeholder="Phone" value="{{candidate.phone if candidate else ''}}"></div>
      <div class="col-12 col-md-6"><input class="form-control" name="location" placeholder="Location" value="{{candidate.location if candidate else ''}}"></div>
      <div class="col-12 col-md-6"><input type="number" step="0.1" class="form-control" name="experience_years" placeholder="Experience years" value="{{candidate.experience_years if candidate else ''}}"></div>
      <div class="col-12 col-md-6"><input class="form-control" name="education" placeholder="Education" value="{{candidate.education if candidate else ''}}"></div>
      <div class="col-12"><input class="form-control" name="skills" placeholder="Skills (optional)" value="{{candidate.skills if candidate else ''}}"></div>
      <div class="col-12">
        <label class="form-label">Resume PDF/DOCX/TXT{% if candidate and candidate.resume_file %} <small class="text-muted">(leave blank to keep current resume)</small>{% endif %}</label>
        <input type="file" class="form-control" name="resume" accept=".pdf,.docx,.txt">
      </div>
      <div class="col-12">
        <button class="btn btn-add-candidate">
          <i class="bi {{'bi-check-lg' if candidate else 'bi-plus-lg'}} me-1"></i>{{'Save Changes' if candidate else 'Add Candidate'}}
        </button>
        {% if candidate %}<a class="btn btn-outline-secondary" href="{{url_for('candidate_detail',cid=candidate.id)}}">Cancel</a>{% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
